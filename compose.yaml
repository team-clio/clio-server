services:
  postgres:
    image: 'pgvector/pgvector:pg16'
    environment:
      - 'POSTGRES_DB=clio'
      - 'POSTGRES_PASSWORD=clio'
      - 'POSTGRES_USER=clio'
    ports:
      - '5432:5432'
    volumes:
      - 'clio-postgres:/var/lib/postgresql/data'
      - './db/init:/docker-entrypoint-initdb.d:ro'
  ollama:
    image: 'ollama/ollama:0.32.3'
    environment:
      OLLAMA_EMBEDDING_MODEL: 'qwen3-embedding:0.6b'
      OLLAMA_HOST: '0.0.0.0:11434'
    entrypoint: ['/bin/sh', '/bootstrap.sh']
    ports:
      - '11434:11434'
    volumes:
      - 'clio-ollama:/root/.ollama'
      - './docker/ollama/bootstrap.sh:/bootstrap.sh:ro'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'OLLAMA_HOST=http://127.0.0.1:11434 ollama show qwen3-embedding:0.6b >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 10s

volumes:
  clio-postgres:
  clio-ollama:
