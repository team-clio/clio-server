spring:
  application:
    name: clio
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clio}
    username: ${SPRING_DATASOURCE_USERNAME:clio}
    password: ${SPRING_DATASOURCE_PASSWORD:clio}
  jpa:
    hibernate:
      ddl-auto: ${CLIO_DDL_AUTO:update}
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        clio.workflow.duration: true
  tracing:
    sampling:
      probability: ${CLIO_TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      service.name: clio-server
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

clio:
  observability:
    stuck-threshold: ${CLIO_WORKFLOW_STUCK_THRESHOLD:PT5M}
  agent:
    enabled: ${CLIO_AGENT_ENABLED:true}
    url: ${CLIO_AGENT_URL:http://localhost:2024}
  pcm-inspect:
    url: ${CLIO_PCM_INSPECT_URL:http://localhost:2025}

logging:
  structured:
    format:
      console: logstash
